workflows:
  legacy-audio-build:
    name: Element X with Legacy Audio
    environment:
      xcode: 15.3
      node: 18
      cocoapods: default
    scripts:
      - name: Clone repositories
        script: |
          git clone https://github.com/z5nobe168/element-x-ios
          git clone https://github.com/element-hq/element-ios old-element
          cd element-x-ios
          mkdir -p LegacyAudio/Headers LegacyAudio/Implementation
          cp ../old-element/Riot/Modules/Call/MXCall* LegacyAudio/Implementation/
          cp ../old-element/Riot/Modules/Common/MXSound.* LegacyAudio/Implementation/
          cp ../old-element/Riot/Assets/Sounds/*.caf Resources/Sounds/
          
      - name: Install dependencies
        script: |
          cd element-x-ios
          swift package resolve
          pod install
          
      - name: Build IPA
        script: |
          cd element-x-ios
          xcodebuild -workspace ElementX.xcworkspace \
                     -scheme ElementX \
                     -configuration Release \
                     -archivePath build/ElementX.xcarchive \
                     archive
                     
          xcodebuild -exportArchive \
                     -archivePath build/ElementX.xcarchive \
                     -exportOptionsPlist ci/exportOptions.plist \
                     -exportPath build/IPA \
                     -allowProvisioningUpdates
    artifacts:
      - element-x-ios/build/IPA/*.ipa
    publishing:
      scripts:
        - name: Upload to Firebase
          script: |
            firebase appdistribution:distribute element-x-ios/build/IPA/ElementX.ipa  \
              --app YOUR_APP_ID \
              --groups "testers"